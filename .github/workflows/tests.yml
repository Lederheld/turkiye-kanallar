name: Testler

# Yalnızca ağ gerektirmeyen birim testleri; gizli değer kullanmaz, gist'e yazmaz.
on:
  push:
    paths: ["*.py", "tests/**", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["*.py", "tests/**", ".github/workflows/tests.yml"]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıklar
        run: pip install -r requirements.txt
      - name: Testler
        run: python -m unittest discover -s tests -v
